# Main configuration file
solana:
  rpc_endpoints:
    primary: "https://api.mainnet-beta.solana.com"
    secondary: "https://rpc.ankr.com/solana"
    fallback: "https://solana-api.projectserum.com"
  
  rate_limits:
    requests_per_minute: 120
    batch_size: 20
    retry_attempts: 3

filters:
  # Token blacklist
  blacklisted_tokens: []
  
  # Developer blacklist
  blacklisted_developers: []
  
  # Mint blacklist
  blacklisted_mints: []
  
  # Scam detection patterns
  scam_patterns:
    - ".*[Rr][Uu][Gg].*"
    - ".*[Ss][Cc][Aa][Mm].*"
    - ".*[Pp][Uu][Mm][Pp].*"
    - ".*[Dd][Uu][Mm][Pp].*"
    - "test.*"
    - ".*fake.*"
  
  # Minimum requirements
  minimum_requirements:
    liquidity_usd: 1000
    holders: 50
    age_hours: 24
    volume_24h_usd: 500
  
  # Suspicious activity indicators
  suspicious_indicators:
    high_owner_concentration: 20
    low_holder_count: 100
    recent_creation_hours: 2
    large_sell_threshold: 10
    abnormal_tx_count: 1000

tier_classification:
  tier_1:
    min_liquidity_usd: 1000000
    min_holders: 1000
    min_age_days: 30
  
  tier_2:
    min_liquidity_usd: 100000
    min_holders: 500
    min_age_days: 7
  
  tier_3:
    min_liquidity_usd: 10000
    min_holders: 100
    min_age_days: 1

alerts:
  webhook_url: ""
  
  notification_types:
    tier_upgrade: true
    new_rug_indicators: true
    suspicious_activity: true
  
  thresholds:
    whale_threshold_usd: 10000
    large_tx_threshold_usd: 5000
    price_change_alert: 20

database:
  postgres:
    host: "localhost"
    port: 5432
    database: "solana_analysis"
    user: "postgres"
    password: "${DB_PASSWORD}"
  
  sqlite:
    path: "data/tokens.db"

logging:
  level: "INFO"
  file: "logs/bot.log"
  max_size_mb: 100
  backup_count: 5

monitored_wallets: []
